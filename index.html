const CATALOG=[
['Spin & Straw Drop','🥤','Spin the straw, steady your hand, and drop it through the bottle opening.','Place a bottle on the floor. Each player turns around once slowly, then aims and releases a straw into the bottle. First successful drop wins.','Baby’s Coordination Mentor',45,['🌀','🥤','🎯']],
['Balloon Waddle','🎈','Carry balloons between your legs to the finish without hands.','Place one balloon between the knees, waddle to the marked target and drop it into the basket. First to complete the required rounds wins.','Baby’s Balance Mentor',60,['🎈','🚶','🧺']],
['Guess the Nursery Rhyme','🎵','Listen closely and name the nursery rhyme.','Host plays or hums short nursery-rhyme clips. First to buzz and correctly name three wins. Host supplies the audio.','Baby’s Music Mentor',60,['🎶','👂','💡']],
['Sticky Note Shake-Off','🟨','Shake those sticky notes off — no hands!','Attach an equal number of sticky notes to each player’s clothes, avoiding skin and hair. First to shake them all off without hands wins.','Baby’s Goofiness Mentor',45,['🟨','🕺','✨']],
['Tongue Twister','🗣️','Say the silly sentence perfectly, three times fast.','Players alternate saying the same tongue twister three times without stumbling. Fastest clean attempt wins.','Baby’s Speaking Mentor',45,['🗣️','⚡','😆']],
['Dumb Charades','🎭','Act it out — no speaking!','Each player acts out a baby-themed phrase while their designated teammates guess. Most correct within the timer wins.','Baby’s Acting Mentor',60,['🎭','🤫','💡']],
['Cone & Rings / Cup & Balls','🎯','Land more rings or balls than your opponent.','Host chooses ring toss onto cones or bouncing ping-pong balls into cups. Five attempts each; most successful wins.','Baby’s Precision Mentor',60,['⭕','🎯','🏆']],
['Three-Balloon Juggle','🎈','Keep three balloons floating at once.','Each player keeps three balloons in the air, with no holding. Longest time before any balloon touches the ground wins.','Baby’s Multitasking Mentor',60,['🎈','🎈','🎈']],
['M&M Color Chaos','🍬','Sort the colorful candies into matching cups.','Players separate equal mixed piles of M&Ms by color, using a spoon or fingers according to the host rule. First accurate sort wins.','Baby’s Organization Mentor',60,['🍬','🌈','🥣']],
['Nuts & Bolts Tower','🔩','Build the tallest stable tower using a toothpick.','Move and stack hex nuts one at a time with a toothpick. Highest stable tower after the timer wins. Use blunt picks and keep small parts away from children.','Baby’s Engineering Mentor',60,['🔩','🏗️','🏆']],
['Baby Brain Memory','🧠','Memorize the tray, then name what disappeared.','Show 12 baby items for 20 seconds, cover them, remove 3, and ask each player to identify missing objects.','Baby’s Memory Mentor',60,['👀','🧠','❓']],
['Candle Hurricane','🕯️','Fan out the flames with a plate held in your mouth.','Use lightweight paper-flame targets or LED candles, not real flames. Hold a clean paper plate gently between lips and fan the paper targets down. Fastest wins.','Baby’s Energy Mentor',45,['🕯️','💨','✨']],
['Ring Color Swap','🔴','Swap the two colors, one piece at a time.','Two rings begin with different-colored objects. Move only one object per turn using the agreed spare space until colors have fully switched. Fastest wins.','Baby’s Strategy Mentor',75,['🔴','🔁','🔵']],
['Cookie Treasure Hunt','🍪','Find the cookie hidden among ping-pong balls.','Search a tub of clean ping-pong balls for a wrapped cookie using oven mitts. First to find it wins. No face-first searching or speed eating.','Baby’s Treasure Mentor',45,['🏓','🔎','🍪']],
['Hanging Bun Challenge','🥯','Catch a bite of the swinging bun without hands.','Hang individual buns at comfortable face height from a secure stand. Players try a small bite without hands; no leg ties or timed swallowing.','Baby’s Snack Mentor',60,['🥯','〰️','😋']],
['Flip It Like a Pro','🥤','Flip cups until they land upright.','Each player must successfully flip five lightweight plastic cups from the edge of a table. First to finish wins.','Baby’s Persistence Mentor',60,['🥤','🔄','🏆']]

onst awards=()=>{const n=S.active.slice(0,S.gameCount).length,b=S.bonusActive.slice(0,S.bonusCount).length;const base=Math.floor(pool()/(2*(n+b*S.bonusRatio+(S.powerups?2:0))||1));return {individual:Math.max(0,base),bonus:Math.max(0,Math.floor(base*S.bonusRatio))}};const maximum=()=>{const v=awards();return 2*(S.active.slice(0,S.gameCount).length*v.individual+S.bonusActive.slice(0,S.bonusCount).length*v.bonus+(S.powerups?2*v.individual:0))};const scores=()=>S.results.reduce((a,r)=>{a[r.winner]+=r.points;return a},{A:0,B:0});const payouts=()=>{const s=scores(),a=s.A+(S.guessA===S.gender?S.bidA:-S.bidA),b=s.B+(S.guessB===S.gender?S.bidB:-S.bidB);return {a,b,parents:pool()-a-b}};const opt=(values,selected)=>values.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(t)}</option>`).join('');function go(v){view=v;location.hash=v;startView()}function render(){document.body.classList.toggle('projector',view==='audience');$('app').innerHTML=view==='host'?host():view==='welcome'?welcome():view==='register'?welcome():view==='audience'?audience():rules()};const label=(text,control)=>`<label class="field">${text}${control}</label>`;const field=(key,type='number',min=0)=>`<input type="${type}" ${type==='number'?`min="${min}"`:''} value="${esc(S[key])}" onchange="change('${key}',this.value)">`;function change(key,value){if(S.locked&&['fee','host','gameCount','bonusCount','bonusRatio'].includes(key))return alert('Unlock the Baby Bank first.');S[key]=['fee','host','gameCount','bonusCount','bonusRatio'].includes(key)?Number(value):value;if(key==='gameCount')S.active=CATALOG.map((_,i)=>i).slice(0,S.gameCount);if(key==='bonusCount')S.bonusActive=BONUS.map((_,i)=>i).slice(0,S.bonusCount);save();render()}

function welcome(){return `<div class="panel center" style="max-width:750px;margin:20px auto;padding:clamp(20px,5vw,45px)"><div style="font-size:65px">🎓🍼🐘</div><p class="tag">OFFICIAL ADMISSION NOTICE · CLASS OF 2026</p><h1>Baby's Mentor Academy</h1><h2>Congratulations. You've Been Volunteered!</h2><p style="font-size:19px">Your application to mentor a tiny human has been approved. We didn't receive an application, but that's beside the point.</p><div class="grid" style="text-align:left;margin:25px 0"><div class="panel"><h3>🧠 Your qualifications</h3><p>At least three functioning brain cells, questionable dancing skills, and a willingness to lose gracefully.</p></div><div class="panel"><h3>🏆 Your mission</h3><p>Find your animal-sound partner, survive silly challenges, support your team, and compete for the prize pool!</p></div></div><div class="panel" style="background:#e9f4e8"><p class="tag">ACADEMY TUITION DEPARTMENT</p><h1>$20</h1><p>One-time participation fee. Zero guaranteed dignity. Your contribution goes into the competition prize pool.</p><h2>💸 Pay with Zelle</h2><p style="font-size:25px;font-weight:900">845-464-4462</p><button onclick="navigator.clipboard.writeText('845-464-4462').then(()=>alert('Zelle number copied!'))">📋 Copy Zelle number</button><p class="tiny">Memo: Baby Mentor Academy · Verify the recipient name in your banking app before sending.</p><div class="separator"></div><h2>💵 Or pay cash</h2><p>Hand $20 to the Academy Treasurer (the host). Exact change earns imaginary bonus points.</p></div><h3>🎉 Important disclaimer</h3><p>The baby reserves the right to reject your mentorship, cry during your speeches, and wake you up at 3 AM.</p><p class="muted tiny">No registration needed on your phone. The host will check you in and confirm payment.</p></div>`}
function register(){return `<section class="panel center"><h1>Welcome, Future Mentor! 👶</h1><p>Join the Baby's Mentor Academy and collect your numbered token.</p><div style="max-width:400px;margin:auto">${label('Your name','<input id="selfName" placeholder="Enter your name">')}<button onclick="selfRegister()">Register & receive token</button></div><p class="muted tiny">Your entry fee is confirmed separately by the host.</p></section>`}
function liveSeconds(){return S.timerRunning&&S.timerEndAt?Math.max(0,Math.ceil((S.timerEndAt-Date.now())/1000)):Math.max(0,Number(S.timer)||0)}

if(mode==='waddle')scene=`<g class="demo-travel">${figure}<ellipse cx="147" cy="233" rx="20" ry="26" fill="#f28fb4" class="demo-held"/></g><path d="M600 220L617 275H724L742 220Z" fill="#438cbb" stroke="#b4e6f7" stroke-width="5"/><ellipse cx="670" cy="220" rx="70" ry="12" fill="#204967" stroke="#b4e6f7" stroke-width="4"/><ellipse class="demo-drop" cx="670" cy="213" rx="21" ry="26" fill="#f28fb4"/>`;
else if(['throw','spin','tictac'].includes(mode))scene=`${figure}<g class="demo-projectile"><text x="0" y="0" font-size="58">${object}</text></g><g transform="translate(620 215)"><text font-size="95">${target}</text></g><path d="M205 155Q400 15 590 170" fill="none" stroke="#f6dbad" stroke-width="4" stroke-dasharray="12 12" opacity=".65"/>`;
else if(mode==='juggle')scene=`${figure}${[0,1,2].map((_,i)=>`<text class="demo-juggle demo-j${i}" x="${340+i*100}" y="155" font-size="72">🎈</text>`).join('')}`;
else if(['sort','stack','swap','search','memory','flip'].includes(mode))scene=`${figure}<rect x="300" y="205" width="385" height="15" rx="7" fill="#b19e9b"/><text x="355" y="185" font-size="70">${object}</text><text class="demo-transfer" x="380" y="145" font-size="62">${object}</text><text x="585" y="185" font-size="76">${target}</text>`;
else if(['listen','talk','mime','draw'].includes(mode))scene=`${figure}<text class="demo-wave" x="290" y="130" font-size="100">${object}</text><text class="demo-answer" x="565" y="145" font-size="100">${target}</text><path d="M220 125Q385 50 525 125" stroke="#eac785" stroke-width="4" fill="none" stroke-dasharray="10 14"/>`;
else if(['fan','shake','bite'].includes(mode))scene=`${figure}<text class="demo-shake" x="345" y="130" font-size="95">${object}</text><text class="demo-fall" x="590" y="170" font-size="85">${target}</text>`;
else if(['relay','battle'].includes(mode))scene=`<g class="demo-travel">${figure}<text x="185" y="190" font-size="75">${object}</text></g><text x="645" y="212" font-size="95">${target}</text>`;
return `<div class="live-demo" data-mode="${mode}"><svg class="demo-scene" viewBox="0 0 800 300" role="img" aria-label="Animated demonstration: ${esc(caption)}"><text x="40" y="32" fill="#f5ddaa" font-size="23" font-weight="700">START</text><text x="685" y="32" fill="#f5ddaa" font-size="23" font-weight="700">GOAL</text>${common}${scene}</svg><div class="demo-caption">${esc(caption)}</div><div class="demo-loop-label">↻ DEMONSTRATION REPEATS</div></div>`}
function refreshTimerDisplays(){const n=liveSeconds(),v=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');document.querySelectorAll('[data-live-timer]').forEach(e=>{e.textContent=v;e.classList.toggle('urgent',n>0&&n<=10)});if(S.timerRunning&&n===0){S.timerRunning=false;S.timer=0;S.timerEndAt=null;save()}}
setInterval(refreshTimerDisplays,200);
function audience(){const sc=scores(),g=gameDefs(),item=g[S.current],ceremony=S.verseStep>0&&!S.finalReveal;const head=`<div class="projection-brand">✦ THE GREAT REVEAL ✦<small>BABY'S MENTOR ACADEMY</small></div>`;let center='';if(!S.finalReveal&&!ceremony&&S.openingScene&&S.openingScene!=='games'){center=openingAudience()}else if(S.finalReveal){center=`<div class="projection-icon confetti">🎉</div><div class="projection-title confetti">IT'S A ${esc(S.gender).toUpperCase()}!</div><p class="projection-sub">A beautiful blessing is on the way</p>`}else if(ceremony){const step=S.verseStep;const messenger=step<=6?S.guests.find(x=>x.token===S.clueGuests[step-1]):null;center=`<div class="projection-eyebrow">THE BLESSING · JEREMIAH 1:5</div><div class="projection-icon">${step<=6?'✉️':'💌'}</div><div class="projection-title">${step<=6?'MESSENGER '+step+' OF 6':'THE FINAL ENVELOPE'}</div><div class="projection-sub">${step<=6?'Guest #'+esc(messenger?.token||'?')+' · '+esc(messenger?.name||'Please come forward'):'The host brings the final clue to the parents'}</div><div class="projection-verse">${step<=6?esc(CLUES[step-1]):'Before I formed thee in the belly I knew thee...'} </div><p class="projection-sub">${step<=6?'The parents read the clue aloud':'The parents open the envelope · Awaiting their announcement'}</p><div class="projection-dots">${Array.from({length:7},(_,i)=>`<span class="${i<step?'on':''}"></span>`).join('')}</div>`}else if(S.revealed&&item){center=`<div class="projection-eyebrow">MYSTERY CHALLENGE ${S.current+1}</div><div class="projection-icon">${item[1]}</div><div class="projection-title">${esc(item[0])}</div><p class="projection-sub">${esc(item[2])}</p>${item.id==='b4'?bottleDemo():animatedDemo(item)}<p class="projection-instruction">${esc(item[3])}</p><div class="projection-timer" data-live-timer>00:00</div><div class="projection-eyebrow">ROUND TIMER</div>`}else{center=`<div class="projection-icon">🎁</div><div class="projection-title">${item?'MYSTERY CHALLENGE '+(S.current+1):'A BLESSING UNFOLDS'}</div><p class="projection-sub">${item?'Who will become the next Baby Mentor?':'Our final ceremony begins soon'}</p>`}return `<div class="projection-shell">${head}<div class="projection-content" key="${S.current}-${S.revealed}-${S.verseStep}-${S.finalReveal}">${center}</div><div class="projection-footer">${!ceremony&&!S.finalReveal?`<div class="projection-score">TEAM A <strong>${sc.A}</strong></div><div class="projection-score">TEAM B <strong>${sc.B}</strong></div>`:S.finalReveal?'<span>♡ FEARFULLY AND WONDERFULLY LOVED ♡</span>':'<span>ONE VERSE · SIX MESSENGERS · ONE FINAL BLESSING</span>'}</div></div>`}
function rules(){return `<h1>📖 How the Academy Works</h1><div class="grid"><section class="panel"><h2>1. Register</h2><p>Each guest receives a numbered token and an animal partner. Host confirms payment.</p></section><section class="panel"><h2>2. Choose captains</h2><p>Animal pairs find each other. Math challenge winners become opposing captains. Rock-paper-scissors divides each remaining pair across teams.</p></section><section class="panel"><h2>3. Lock the mystery</h2><p>Captains assign teammates to game numbers before discovering the challenges. Bonus rounds are played as teams.</p></section><section class="panel"><h2>4. Play for dollars</h2><p>Each point is $1. Awards are dynamically calculated from the paid pool, game count, bonus ratio, and captain power-ups.</p></section><section class="panel"><h2>5. Secret gender bid</h2><p>Captains privately predict Boy or Girl and bid up to their bank balance. Correct guesses add the bid; incorrect guesses subtract it.</p></section><section class="panel"><h2>6. The reveal</h2><p>Six randomly drawn guests bring Jeremiah 1:5 clue cards to the parents, who read each aloud. The host delivers the final sealed gender clue, then triggers the projector reveal and payouts.</p></section></div><section class="panel"><h2>Safety and fairness</h2><p>Use flameless targets instead of candles, avoid tying food to legs, do not speed-eat, avoid balloon popping and rubber-band projectiles, and accommodate guests who cannot perform physical challenges. The host can substitute an accessible equivalent.</p></section>`}
const CLUES=['Before I formed thee','in the belly','I knew thee;','and before thou camest forth','out of the womb','I sanctified thee.'];
function verse(){if(S.verseStep===0)return 'The blessing will unfold one clue at a time.';if(S.verseStep<=6)return CLUES.slice(0,S.verseStep).join(' ')+' · Jeremiah 1:5 (KJV, excerpt)';return 'Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I sanctified thee. — Jeremiah 1:5 (KJV, excerpt) · The host now delivers the final sealed envelope.'}
function drawClues(){if(S.cluesLocked)return alert('Unlock the assignments before drawing again.');const available=S.guests.filter(g=>g.checkedIn!==false);if(available.length<6)return alert('At least six guests must be checked in.');const shuffled=[...available];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}S.clueGuests=shuffled.slice(0,6).map(g=>g.token);S.verseStep=0;save();render()}
function printClues(){if(S.clueGuests.length!==6)return;const cards=S.clueGuests.map((token,i)=>`<article style="page-break-after:always;border:3px solid #b8a078;padding:55px;min-height:75vh;text-align:center;font-family:Georgia,serif"><h2>THE GREAT REVEAL</h2><p>Messenger ${i+1} · Guest #${token} · ${esc(S.guests.find(g=>g.token===token)?.name||'')}</p><h1 style="margin:90px 0;font-size:38px">${esc(CLUES[i])}</h1><p>Jeremiah 1:5 (KJV, excerpt)</p><p>Hand this card to the parents-to-be. Let them read it aloud.</p></article>`).join('');const w=window.open('','_blank');if(!w)return alert('Allow popups to print cards.');w.document.write('<!doctype html><html><head><title>Six Bible clue cards</title></head><body>'+cards+'</body></html>');w.document.close();w.focus();w.print()}
function finalPanel(){if(!S.finalReveal)return '';const p=payouts();return `<div class="panel center confetti"><h1>It's a ${esc(S.gender)}! 🎊</h1><div class="stats"><div class="stat teamA"><b>${money(p.a)}</b>Team A payout</div><div class="stat teamB"><b>${money(p.b)}</b>Team B payout</div><div class="stat"><b>${money(p.parents)}</b>Parents-to-be</div></div><p>Total ${money(pool())} · Team payouts ${money(p.a+p.b)}</p></div>`}
function addGuest(){const name=$('guestName').value.trim();if(!name)return alert('Enter a name');S.guests.push({name,token:Math.max(0,...S.guests.map(g=>g.token))+1,paid:$('guestPaid').checked,checkedIn:true,team:$('guestTeam').value});save();render()}function selfRegister(){const name=$('selfName').value.trim();if(!name)return alert('Enter your name');const token=Math.max(0,...S.guests.map(g=>g.token))+1;S.guests.push({name,token,paid:false,checkedIn:true,team:''});save();$('app').innerHTML=`<section class="panel center"><h1>Welcome, ${esc(name)}!</h1><p>Your token number</p><div class="big">#${token}</div><p>Show this number to the host to confirm entry.</p><button onclick="go('register')">Register another guest</button></section>`}function updateGuest(token,k,v){const g=S.guests.find(x=>x.token===token);if(g){g[k]=v;save();render()}}function removeGuest(token){if(!confirm('Remove guest?'))return;S.guests=S.guests.filter(x=>x.token!==token);save();render()}function toggleGame(i,on,bonus){if(S.assignLocked)return;const k=bonus?'bonusActive':'active';S[k]=on?[...S[k],i]:S[k].filter(x=>x!==i);S[bonus?'bonusCount':'gameCount']=S[k].length;save();render()}function shuffleGames(){if(S.assignLocked)return;for(const k of ['active','bonusActive'])S[k].sort(()=>Math.random()-.5);save();render()}function assign(t,i,token){S['assign'+t][i]=token;save()}function lockAssignments(){if(!S.assignLocked){for(const t of ['A','B']){const assigned=Object.values(S['assign'+t]).filter(Boolean);if(new Set(assigned).size!==assigned.length)return alert('A player is assigned to multiple games for Team '+t)}if(!S.locked)return alert('Lock the Baby Bank first.')}S.assignLocked=!S.assignLocked;save();render()}function win(t){const g=gameDefs(),item=g[S.current];if(!item||S.results.some(r=>r.id===item.id))return;const v=awards(),power=!item.bonus&&S.powerups&&$('power'+t)?.checked&&!S.powerUsed[t];if(power)S.powerUsed[t]=true;const points=(item.bonus?v.bonus:v.individual)*(power?2:1);S.results.push({id:item.id,name:item[0],winner:t,points,mentor:item[4]});S.current++;S.revealed=false;S.timer=0;S.timerRunning=false;S.timerEndAt=null;save();render()}function undo(i){if(!confirm('Undo this game result?'))return;const r=S.results.splice(i,1)[0];if(r.points===awards().individual*2&&r.id.startsWith('g'))S.powerUsed[r.winner]=false;S.current=Math.max(0,S.current-1);save();render()}function bid(t,value){const sc=scores()[t],n=Number(value);if(!Number.isInteger(n)||n<0||n>sc)return alert('Bid must be a whole number between 0 and '+sc);S['bid'+t]=n;save()}function lockBids(){if(!S.bidsLocked){if(!S.guessA||!S.guessB||S.bidA===null||S.bidB===null)return alert('Both teams must submit predictions and bids.');if(S.bidA>scores().A||S.bidB>scores().B)return alert('Bid exceeds score.')}S.bidsLocked=!S.bidsLocked;save();render()}function startTimer(duration){const n=liveSeconds()||duration;S.timer=n;S.timerEndAt=Date.now()+n*1000;S.timerRunning=true;save();refreshTimerDisplays()}
function stopTimer(){S.timer=liveSeconds();S.timerRunning=false;S.timerEndAt=null;save();refreshTimerDisplays()}
function resetTimer(v){S.timer=v;S.timerRunning=false;S.timerEndAt=null;save();refreshTimerDisplays()}
function demo(){if(!confirm('Replace guests with 30 demo guests?'))return;S.guests=Array.from({length:30},(_,i)=>({name:'Guest '+(i+1),token:i+1,paid:true,checkedIn:true,team:i%2?'B':'A'}));save();render()}function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='baby-mentor-event.json';a.click();URL.revokeObjectURL(a.href)}function resetEvent(){if(confirm('Delete ALL local event data?')){S=defaults();save();render()}}async function startView(){document.querySelector('header').style.display=(view==='welcome'?'none':'');if(view==='welcome'||view==='rules'){render();return;}if(view==='host'&&!HOST_PIN){const p=prompt('Host access PIN (ask the event organizer):');if(!p){view='welcome';location.hash='welcome';render();return;}HOST_PIN=p;sessionStorage.setItem('academyHostPin',p);}try{const r=await fetch('/api/state',{headers:HOST_PIN&&view==='host'?{'X-Host-Pin':HOST_PIN}:{}});if(!r.ok)throw Error(r.status===401?'Incorrect host PIN':'Server unavailable');const j=await r.json();S={...defaults(),...j.state};liveVersion=j.version;remoteReady=true;render()}catch(e){if(view==='host'){HOST_PIN='';sessionStorage.removeItem('academyHostPin');alert(e.message);view='welcome';location.hash='welcome';render()}else{$('app').innerHTML='<div class="panel">Projector is waiting for the server. Refresh this page.</div>'}}}
view=['host','audience','welcome','register','rules'].includes(location.hash.slice(1))?location.hash.slice(1):'welcome';window.addEventListener('hashchange',()=>{view=location.hash.slice(1)||'welcome';startView()});window.addEventListener('storage',e=>{if(view==='host'&&e.key===KEY&&e.newValue){try{S={...defaults(),...JSON.parse(e.newValue)};render()}catch{}}});setInterval(async()=>{if(view!=='audience'||!remoteReady)return;try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(j.version!==liveVersion){S={...defaults(),...j.state};liveVersion=j.version;render()}}catch{}},1500);startView();
